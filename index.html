    --danger: #C4573B;
    --success: #6B9E5E;
    --radius: 3px;

    color: var(--text);

  #root { min-height: 100vh; }

  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {

    font-weight: 700;

    letter-spacing: 0.02em;
    color: var(--accent);
  }

    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);

  .nav-item {
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-dim);

    border-left: 3px solid transparent;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.02); }

    color: var(--text);

    background: rgba(242,183,5,0.06);

  .nav-count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface);
    padding: 1px 6px;
    border-radius: var(--radius);
  }
  .sidebar-footer {
    margin-top: auto;
    padding: 16px 20px 0;
    border-top: 1px solid var(--border);

  .sidebar-footer .user {
    font-size: 13px;

  h1.page-title {

    border-radius: var(--radius);

    font-family: var(--font-mono); font-weight: 500; font-size: 13px;
    padding: 3px 9px; border-radius: 20px;
  }
  .score-alta { background: rgba(107,158,94,0.15); color: var(--success); }
  .score-media { background: rgba(242,183,5,0.15); color: var(--accent); }
  .score-baixa { background: rgba(196,87,59,0.15); color: var(--danger); }

    position: fixed; inset: 0; background: rgba(0,0,0,0.55);

    padding: 48px 20px; overflow-y: auto; z-index: 50;
