/* =========================================================
   Utilitários
   ========================================================= */
async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function scoreBand(score) {
  if (score >= 75) return "alta";
  if (score >= 50) return "media";
  return "baixa";
}

// Extrai texto de PDF usando pdf.js
async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(" ") + "\n";
  }
  return text.trim();
}

// Extrai texto de DOCX usando mammoth
async function extractDocxText(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value.trim();
}

async function extractResumeText(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".pdf")) return extractPdfText(file);
  if (name.endsWith(".docx")) return extractDocxText(file);
  throw new Error("Formato não suportado. Envie um PDF ou um .docx.");
}

// Chama a Edge Function que faz a comparação com IA.
// Até o Supabase estar plugado, cai num modo de simulação local (aviso visível).
async function scoreCandidateAgainstVagas(curriculoTexto, vagas) {
  if (supabase) {

      body: { curriculo: curriculoTexto, vagas: vagas.map(v => ({ id: v.id, titulo: v.titulo, descricao: v.descricao, requisitos: v.requisitos })) },
    });
    if (error) throw error;
    return data.resultados; // [{ vaga_id, score, pontos_fortes, pontos_fracos, justificativa }]
  }
  // Modo simulação (sem backend ainda) — só pra você ver a interface funcionando
  return vagas.map(v => ({
    vaga_id: v.id,
    score: Math.floor(Math.random() * 60) + 30,

}

/* =========================================================
   Tela de Login
   ========================================================= */
function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setErro("");
    if (!supabase) { setErro("Backend ainda não conectado (Supabase pendente)."); return; }
    setCarregando(true);
    try {
      const hash = await sha256(senha);
      const { data, error } = await supabase
        .from("usuarios")
        .select("id, nome, email, papel")
        .eq("email", email.trim().toLowerCase())
        .eq("senha_hash", hash)
        .maybeSingle();
      if (error) throw error;
      if (!data) { setErro("E-mail ou senha incorretos."); return; }
      localStorage.setItem("rh_econstrucao_user", JSON.stringify(data));
      onLogin(data);
    } catch (err) {
      setErro("Erro ao entrar: " + err.message);
    } finally {
      setCarregando(false);
    }
  }

  return (
    <div className="login-wrap">
      <div className="card login-card">
        <div className="login-title">RH Econstrução</div>
        <div className="login-sub">Triagem e acompanhamento de candidatos</div>
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label>E-mail</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required autoFocus />
          </div>
          <div className="field">
            <label>Senha</label>
            <input type="password" value={senha} onChange={e => setSenha(e.target.value)} required />
          </div>
          <button className="btn btn-primary" style={{ width: "100%" }} disabled={carregando}>
            {carregando ? "Entrando..." : "Entrar"}
          </button>
          {erro && <div className="login-error">{erro}</div>}
        </form>
      </div>
    </div>
  );
}

/* =========================================================
   Vagas
   ========================================================= */
function VagasView({ vagas, onRefresh, showToast }) {
  const [modalAberto, setModalAberto] = useState(false);
  const [editando, setEditando] = useState(null);
  const [form, setForm] = useState({ titulo: "", descricao: "", requisitos: "", localizacao: "", salario: "", status: "aberta" });

  function abrirNovo() {
    setEditando(null);
    setForm({ titulo: "", descricao: "", requisitos: "", localizacao: "", salario: "", status: "aberta" });
    setModalAberto(true);
  }
  function abrirEdicao(v) {
    setEditando(v);
    setForm({ titulo: v.titulo, descricao: v.descricao || "", requisitos: v.requisitos || "", localizacao: v.localizacao || "", salario: v.salario || "", status: v.status });
    setModalAberto(true);
  }

  async function salvar(e) {
    e.preventDefault();
    if (!supabase) { showToast("Backend ainda não conectado."); return; }
    if (editando) {
      await supabase.from("vagas").update(form).eq("id", editando.id);
      showToast("Vaga atualizada.");
    } else {
      await supabase.from("vagas").insert(form);
      showToast("Vaga cadastrada.");
    }
    setModalAberto(false);
    onRefresh();
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <h1 className="page-title">Vagas</h1>
          <p className="page-sub">Descrição e requisitos usados pela triagem automática.</p>
        </div>
        <button className="btn btn-primary" onClick={abrirNovo}>+ Nova vaga</button>
      </div>

      {vagas.length === 0 ? (
        <div className="empty-state card">
          <div className="title">Nenhuma vaga cadastrada</div>
          <div>Cadastre a primeira vaga para começar a triar candidatos.</div>
        </div>
      ) : (
        <div className="card" style={{ padding: 0 }}>
          <table>
            <thead>
              <tr><th>Título</th><th>Local</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
              {vagas.map(v => (
                <tr key={v.id}>
                  <td>{v.titulo}</td>
                  <td>{v.localizacao || "—"}</td>
                  <td><span className="tag">{v.status}</span></td>
                  <td style={{ textAlign: "right" }}>
                    <button className="btn" onClick={() => abrirEdicao(v)}>Editar</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {modalAberto && (
        <Modal title={editando ? "Editar vaga" : "Nova vaga"} onClose={() => setModalAberto(false)}>
          <form onSubmit={salvar}>
            <div className="field">
              <label>Título</label>
              <input value={form.titulo} onChange={e => setForm({ ...form, titulo: e.target.value })} required />
            </div>
            <div className="field">
              <label>Descrição das atividades</label>
              <textarea rows="3" value={form.descricao} onChange={e => setForm({ ...form, descricao: e.target.value })} />
            </div>
            <div className="field">
              <label>Requisitos (o que a IA vai comparar com o currículo)</label>
              <textarea rows="4" value={form.requisitos} onChange={e => setForm({ ...form, requisitos: e.target.value })} placeholder="Ex: experiência com faturamento, excel intermediário, 2º grau completo..." />
            </div>
            <div className="field">
              <label>Localização</label>
              <input value={form.localizacao} onChange={e => setForm({ ...form, localizacao: e.target.value })} />
            </div>
            <div className="field">
              <label>Status</label>
              <select value={form.status} onChange={e => setForm({ ...form, status: e.target.value })}>
                <option value="aberta">Aberta</option>
                <option value="fechada">Fechada</option>

              <button type="submit" className="btn btn-primary">Salvar</button>
            </div>
          </form>
        </Modal>
      )}
    </div>
  );
}

/* =========================================================
   Novo Candidato (upload + triagem IA)
   ========================================================= */
function NovoCandidatoModal({ vagas, onClose, onSalvo, showToast }) {
  const [nome, setNome] = useState("");
  const [telefone, setTelefone] = useState("");
  const [email, setEmail] = useState("");
  const [arquivo, setArquivo] = useState(null);
  const [textoExtraido, setTextoExtraido] = useState("");
  const [status, setStatus] = useState("form"); // form | extraindo | analisando | resultado
  const [ranking, setRanking] = useState([]);
  const [vagaEscolhida, setVagaEscolhida] = useState(null);
  const fileInputRef = useRef(null);

  async function handleFile(file) {
    setArquivo(file);
    setStatus("extraindo");
    try {
      const texto = await extractResumeText(file);
      setTextoExtraido(texto);
      setStatus("form");
    } catch (err) {
      showToast("Erro ao ler o arquivo: " + err.message);
      setArquivo(null);
      setStatus("form");
    }
  }

  async function analisar() {
    const vagasAbertas = vagas.filter(v => v.status === "aberta");
    if (vagasAbertas.length === 0) { showToast("Não há vagas abertas para comparar."); return; }
    setStatus("analisando");
    try {
      const resultados = await scoreCandidateAgainstVagas(textoExtraido, vagasAbertas);
      const enriched = resultados.map(r => ({ ...r, vaga: vagasAbertas.find(v => v.id === r.vaga_id) })).sort((a, b) => b.score - a.score);
      setRanking(enriched);
      setVagaEscolhida(enriched[0]?.vaga_id || null);
      setStatus("resultado");
    } catch (err) {
      showToast("Erro na análise: " + err.message);
      setStatus("form");
    }
  }

  async function salvarCandidato() {
    if (!supabase) { showToast("Backend ainda não conectado."); return; }
    const escolha = ranking.find(r => r.vaga_id === vagaEscolhida);
    const { error } = await supabase.from("candidatos").insert({
      nome, telefone, email,
      texto_curriculo: textoExtraido,
      vaga_id: vagaEscolhida,
      score_ia: escolha ? escolha.score : null,
      pontos_fortes: escolha ? escolha.pontos_fortes : null,
      pontos_fracos: escolha ? escolha.pontos_fracos : null,
      etapa_atual: "triagem",
    });
    if (error) { showToast("Erro ao salvar: " + error.message); return; }
    showToast("Candidato cadastrado.");
    onSalvo();
    onClose();
  }

  return (
    <Modal title="Novo candidato" onClose={onClose}>
      {status !== "resultado" ? (
        <div>
          <div className="field">
            <label>Nome completo</label>
            <input value={nome} onChange={e => setNome(e.target.value)} required />
          </div>
          <div className="field">
            <label>Telefone</label>
            <input value={telefone} onChange={e => setTelefone(e.target.value)} />
          </div>
          <div className="field">
            <label>E-mail</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} />
          </div>
          <div className="field">
            <label>Currículo (PDF ou Word)</label>
            <div
              className={"upload-zone" + (arquivo ? " has-file" : "")}
              onClick={() => fileInputRef.current.click()}
            >
              {status === "extraindo" ? "Lendo arquivo..." : arquivo ? `✓ ${arquivo.name} (${textoExtraido.length} caracteres lidos)` : "Clique para selecionar o arquivo (.pdf ou .docx)"}
            </div>
            <input ref={fileInputRef} type="file" accept=".pdf,.docx" style={{ display: "none" }}
              onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
          </div>
          <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 20 }}>
            <button className="btn" onClick={onClose}>Cancelar</button>
            <button
              className="btn btn-primary"
              disabled={!nome || !textoExtraido || status === "analisando"}
              onClick={analisar}
            >
              {status === "analisando" ? "Analisando com IA..." : "Analisar aderência às vagas"}
            </button>
          </div>
        </div>
      ) : (
        <div>
          <p style={{ fontSize: 13, color: "var(--text-dim)", marginTop: 0 }}>
            Aderência de {nome} às vagas abertas. Escolha para qual vaga encaminhar.
          </p>
          {ranking.map(r => (
            <div
              key={r.vaga_id}
              className={"rank-row" + (vagaEscolhida === r.vaga_id ? " selected" : "")}
              onClick={() => setVagaEscolhida(r.vaga_id)}
              style={{ cursor: "pointer" }}
            >
              <div>
                <div className="rank-vaga">{r.vaga?.titulo}</div>
                <div className="rank-reason">{r.justificativa}</div>
              </div>
              <span className={"score-pill score-" + scoreBand(r.score)}>{r.score}%</span>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 20 }}>
            <button className="btn" onClick={() => setStatus("form")}>Voltar</button>
            <button className="btn btn-primary" onClick={salvarCandidato}>
              Confirmar e enviar para Triagem
            </button>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* =========================================================
   Pipeline (Kanban)
   ========================================================= */
function PipelineView({ candidatos, vagas, onRefresh, showToast }) {
  const [modalAberto, setModalAberto] = useState(false);

  async function moverEtapa(candidato, novaEtapa) {
    if (!supabase) { showToast("Backend ainda não conectado."); return; }
    await supabase.from("candidatos").update({ etapa_atual: novaEtapa }).eq("id", candidato.id);
    onRefresh();
  }

  function vagaTitulo(id) {
    return vagas.find(v => v.id === id)?.titulo || "—";
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <h1 className="page-title">Pipeline</h1>
          <p className="page-sub">Acompanhamento dos candidatos etapa a etapa.</p>
        </div>
        <button className="btn btn-primary" onClick={() => setModalAberto(true)}>+ Novo candidato</button>
      </div>

      <div className="kanban">
        {ETAPAS.map((etapa, idx) => {
          const nesta = candidatos.filter(c => c.etapa_atual === etapa.id);
          const proxima = ETAPAS[idx + 1];
          return (
            <div className="kanban-col" key={etapa.id}>
              <div className="kanban-col-head">
                <span>{etapa.label}</span>
                <span>{nesta.length}</span>
              </div>
              {nesta.map(c => (
                <div className="kanban-card" key={c.id}>
                  <div className="name">{c.nome}</div>
                  <div className="vaga">{vagaTitulo(c.vaga_id)}</div>
                  {c.score_ia != null && (
                    <span className={"score-pill score-" + scoreBand(c.score_ia)}>{c.score_ia}% aderência</span>
                  )}
                  <div className="kanban-card-actions">
                    <button className="btn btn-danger" onClick={() => moverEtapa(c, ETAPA_REPROVADO)}>Reprovar</button>
                    {proxima && (
                      <button className="btn btn-primary" onClick={() => moverEtapa(c, proxima.id)}>Avançar</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          );
        })}
      </div>

      {modalAberto && (
        <NovoCandidatoModal
          vagas={vagas}
          onClose={() => setModalAberto(false)}
          onSalvo={onRefresh}
          showToast={showToast}
        />
      )}
    </div>
  );
}

/* =========================================================
   App principal
   ========================================================= */
function App() {
  const [usuario, setUsuario] = useState(() => {
    const saved = localStorage.getItem("rh_econstrucao_user");
    return saved ? JSON.parse(saved) : null;
  });
  const [aba, setAba] = useState("pipeline");
  const [vagas, setVagas] = useState([]);
  const [candidatos, setCandidatos] = useState([]);
  const [toastMsg, setToastMsg] = useState(null);

  function showToast(msg) {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(null), 3500);
  }

  const carregarDados = useCallback(async () => {
    if (!supabase) return;
    const [{ data: v }, { data: c }] = await Promise.all([
      supabase.from("vagas").select("*").order("created_at", { ascending: false }),
      supabase.from("candidatos").select("*").order("created_at", { ascending: false }),
    ]);
    setVagas(v || []);
    setCandidatos(c || []);
  }, []);

  useEffect(() => { if (usuario) carregarDados(); }, [usuario, carregarDados]);

  if (!usuario) return <LoginScreen onLogin={setUsuario} />;

  function logout() {
    localStorage.removeItem("rh_econstrucao_user");
    setUsuario(null);
  }

  return (
    <div className="app-shell">
      <div className="sidebar">
        <div className="sidebar-brand">
          <div className="mark">RH ECONSTRUÇÃO</div>
          <div className="sub">triagem &amp; pipeline</div>
        </div>
        <div className={"nav-item" + (aba === "pipeline" ? " active" : "")} onClick={() => setAba("pipeline")}>
          Pipeline <span className="nav-count">{candidatos.length}</span>
        </div>
        <div className={"nav-item" + (aba === "vagas" ? " active" : "")} onClick={() => setAba("vagas")}>
          Vagas <span className="nav-count">{vagas.length}</span>
        </div>
        <div className="sidebar-footer">
          <div className="user">{usuario.nome}</div>
          <button className="logout-btn" onClick={logout}>Sair</button>
        </div>
      </div>
      <div className="main">
        {!supabase && (
          <div className="card" style={{ marginBottom: 20, borderColor: "var(--accent)" }}>
            <strong>Backend ainda não conectado.</strong> Preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo assim que o projeto existir.
          </div>
        )}
        {aba === "pipeline" && (
          <PipelineView candidatos={candidatos} vagas={vagas} onRefresh={carregarDados} showToast={showToast} />
        )}
        {aba === "vagas" && (
          <VagasView vagas={vagas} onRefresh={carregarDados} showToast={showToast} />
        )}
      </div>
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
